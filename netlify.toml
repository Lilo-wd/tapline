# =============================================================
# Tapline — configuration Netlify
# =============================================================

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------- En-tetes de securite ----------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------- Cache des assets ----------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Cache des pages HTML ----------
# Enumerees explicitement (plutot que "/*") pour ne pas risquer de
# recouvrir la regle de cache longue duree de /assets/* ci-dessus.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/contact/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cgv/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/mentions-legales/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/confidentialite/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/merci/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- URLs propres : anciennes adresses .html -> nouvelles ----------
# Redirections 301 permanentes, pour ne jamais casser un lien deja partage
# meme si le site n'est pas encore indexe.
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/cgv.html"
  to = "/cgv/"
  status = 301
  force = true

[[redirects]]
  from = "/mentions-legales.html"
  to = "/mentions-legales/"
  status = 301
  force = true

[[redirects]]
  from = "/confidentialite.html"
  to = "/confidentialite/"
  status = 301
  force = true

[[redirects]]
  from = "/merci.html"
  to = "/merci/"
  status = 301
  force = true
